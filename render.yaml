# Render Blueprint for the SpeedBike multiplayer game server (free plan; sleeps after ~15 min idle).
# The Firebase service-account key is NOT in the repo: add it in the Render dashboard as the secret
# environment variable FIREBASE_SERVICE_ACCOUNT (paste the whole JSON). See server/README.md.
services:
  - type: web
    name: speedbike-server
    runtime: node
    plan: free
    region: frankfurt # closest to the players (Tel Aviv ~60 ms RTT vs ~300 ms from the US regions); changing it means recreating the service
    autoDeploy: false # pushes to GitHub (website updates) never redeploy the server; deploy it manually from the dashboard
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_AUTH
        value: "0"
      - key: FIREBASE_PROJECT_ID
        value: speedbike-9a552
      - key: ALLOWED_ORIGINS
        value: https://speedbikeapp.github.io
      - key: ADMIN_USERNAMES # non-secret: comma-separated usernames (case-insensitive) that are permanent admins; set the value in the dashboard
        value: ""
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # secret: paste the service-account JSON in the dashboard
      - key: PUBLIC_URL # non-secret: base URL of the website used in e-mailed links (default https://speedbikeapp.github.io)
        value: https://speedbikeapp.github.io
      - key: GMAIL_CLIENT_ID # secrets for sending mail from noreply.speedbike@gmail.com via the Gmail API (see NOTES.md "E-mail")
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
